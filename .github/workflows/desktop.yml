# Monta o instalador do Windows (AUTOMATON-Setup.exe) num Windows de verdade.
# - push na main: monta e publica a Release "v<versão do package.json>" com o instalador
#   (versão nova = suba o "version" no package.json; a mesma versão só troca o arquivo)
# - outras branches: só gera o instalador como "artifact" (aba Actions)
# - se os segredos do itch.io estiverem configurados, a Release também vai pro itch.io
name: Desktop (Windows)

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'lib/**'
      - 'assets/**'
      - 'electron/**'
      - 'build/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar Electron e o empacotador
        run: npm ci

      - name: Montar o instalador
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Pasta pronta pra Steam (SteamPipe)
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT
          Compress-Archive -Path dist/win-unpacked/* -DestinationPath "dist/AUTOMATON-Steam-$v.zip"

      - name: Guardar o instalador (aba Actions)
        uses: actions/upload-artifact@v4
        with:
          name: AUTOMATON-Windows
          path: |
            dist/AUTOMATON-Setup-*.exe
            dist/AUTOMATON-Steam-*.zip
          retention-days: 30

      - name: Publicar a Release no GitHub
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: AUTOMATON ${{ steps.ver.outputs.version }}
          files: dist/AUTOMATON-Setup-*.exe
          make_latest: true
          body: |
            ## 📥 Como instalar
            1. Baixe o **AUTOMATON-Setup-${{ steps.ver.outputs.version }}.exe** aqui embaixo.
            2. Abra e siga o instalador.
            3. Jogue pelo atalho **AUTOMATON**.

            Se o Windows mostrar "O Windows protegeu o computador": **Mais informações → Executar assim mesmo**.

      - name: Enviar pro itch.io (opcional)
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && env.BUTLER_API_KEY != '' && vars.ITCH_GAME != ''
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://broth.itch.zone/butler/windows-amd64/LATEST/archive/default -OutFile butler.zip
          Expand-Archive butler.zip -DestinationPath butler
          $v = (Get-Content package.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force itch | Out-Null
          Copy-Item dist/AUTOMATON-Setup-*.exe itch/
          ./butler/butler.exe push itch "${{ vars.ITCH_GAME }}:windows" --userversion $v
